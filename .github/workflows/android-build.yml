name: DrForex Manual Build & Test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate and Verify Debug Keystore
        run: |
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/debug.keystore"
          echo "Generating standard Android debug keystore at: ${KEYSTORE_PATH}"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: debug.keystore was not created or is empty at ${KEYSTORE_PATH}"
            exit 1
          fi

          echo "Verifying debug keystore with keytool..."
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey

          echo "Debug keystore successfully created and verified."

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-forex-research-lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
