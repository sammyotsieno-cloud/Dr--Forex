name: Android CI / Phase 1 Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore and Verify Debug Keystore
        run: |
          if [ ! -f "debug.keystore.base64" ] || [ ! -s "debug.keystore.base64" ]; then
            echo "ERROR: debug.keystore.base64 is missing or empty from the GitHub checkout."
            exit 1
          fi

          base64 -d debug.keystore.base64 > "${GITHUB_WORKSPACE}/debug.keystore"

          if [ ! -s "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            echo "ERROR: Failed to restore debug.keystore."
            exit 1
          fi

          keytool -list \
            -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

          echo "Debug keystore successfully restored and verified."

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-forex-research-lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
